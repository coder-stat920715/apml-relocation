spring:
  application:
    name: apml-relocation
  profiles:
    default: dev
  jpa:
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
apml:
  gst-rate: 0.05        # GTA (SAC 996511) rate applied on freight + FOV when not GST-exempted
  seed-enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:apml;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apml}
    username: ${DB_USERNAME:apml}
    password: ${DB_PASSWORD:apml}
  jpa:
    hibernate:
      ddl-auto: update   # replace with Flyway/Liquibase migrations for real deployments
apml:
  seed-enabled: false
